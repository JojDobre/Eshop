name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    # Denne: kompatibilita s ďalšími verziami databáz.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pri každej zmene: testy na všetkých podporovaných verziách PHP s MySQL 8.0.
  tests:
    name: PHP ${{ matrix.php }} · MySQL 8.0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eshop_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, intl, zip, bcmath, sodium, gd
          coverage: none

      - name: Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Štýl kódu (Pint)
        if: matrix.php == '8.4'
        run: vendor/bin/pint --test

      - name: Testy
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eshop_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  # Prechod databázy zo všetkých vydaných verzií na aktuálnu.
  upgrades:
    name: Prechody z vydaných verzií · MySQL 8.0
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, zip, bcmath, sodium, gd
          coverage: none
      - name: Composer
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prechody
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root
        run: scripts/test-upgrades.sh

  # Denne a ručne: rovnaké testy na ďalších databázach.
  databases:
    name: PHP 8.4 · ${{ matrix.db.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: 'MySQL 8.4', image: 'mysql:8.4', health: 'mysqladmin ping -proot' }
          - { name: 'MariaDB 10.6', image: 'mariadb:10.6', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { name: 'MariaDB 11.4', image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized' }

    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: eshop_test
          MARIADB_DATABASE: eshop_test
        ports: ['3306:3306']
        options: --health-cmd="${{ matrix.db.health }}" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, zip, bcmath, sodium, gd
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Testy
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: eshop_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  # Inštalačný balík (ZIP) na stiahnutie z výsledkov behu.
  package:
    name: Inštalačný balík
    needs: tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, zip, bcmath, sodium, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: eshop-zip
          path: dist/*.zip
          retention-days: 14
